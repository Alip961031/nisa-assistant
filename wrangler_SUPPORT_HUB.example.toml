# wrangler.toml example for the NISA Support HUB Worker
# Rename/copy this to wrangler.toml in your Worker project, then update IDs.
name = "nisa-deepseek-proxy"
main = "Cloudflare_worker_JS_FULL_COMPATIBLE_SUPPORT_HUB.js"
compatibility_date = "2025-12-01"

[vars]
NISA_AI_CONTROLLER = "true"
DEEPSEEK_MODEL = "deepseek-chat"
NISA_SUPPORT_HUB_URL = "https://YOUR-DOMAIN/hub/"
NISA_R2_PUBLIC_BASE_URL = "https://YOUR-R2-PUBLIC-BASE-URL"

# Secrets to set with: wrangler secret put DEEPSEEK_API_KEY
# DEEPSEEK_API_KEY = "set as secret, not here"

[[kv_namespaces]]
binding = "NISA_LIVECHATS_ACTIVE"
id = "REPLACE_WITH_KV_ID"

[[kv_namespaces]]
binding = "NISA_CONVERSATIONS"
id = "REPLACE_WITH_KV_ID"

[[kv_namespaces]]
binding = "NISA_TRANSLATIONS"
id = "REPLACE_WITH_KV_ID"

[[kv_namespaces]]
binding = "NISA_LEARNING"
id = "REPLACE_WITH_KV_ID"

[[d1_databases]]
binding = "NISA_DB"
database_name = "nisa-support-hub"
database_id = "REPLACE_WITH_D1_ID"

[[r2_buckets]]
binding = "NISA_SOURCES"
bucket_name = "nisa-sources"

[[r2_buckets]]
binding = "NISA_UPLOADS"
bucket_name = "nisa-uploads"
